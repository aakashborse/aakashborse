[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energex"
version = "1.1.0"
description = "Production-grade Backup/Outage Energy ROI Calculator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "typer>=0.12",
    "numpy>=1.24",
    "scipy>=1.11",
    "rich>=13.0",
    "pandas>=2.0",
    "python-dateutil>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "hypothesis>=6.0",
]
ui = [
    "streamlit>=1.28",
    "plotly>=5.17",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "kaleido>=0.2",
]
all = [
    "streamlit>=1.28",
    "plotly>=5.17",
    "matplotlib>=3.7",
    "reportlab>=4.0",
    "kaleido>=0.2",
]

[project.scripts]
energex = "energex.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["energex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
